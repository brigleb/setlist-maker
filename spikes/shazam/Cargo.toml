[package]
name = "shazam-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "M0 spike 1: fingerprint a window in Rust and ask Shazam (throwaway)"

[dependencies]
chfft = "0.3.4"
crc32fast = "1.4"
base64 = "0.22"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rodio = { version = "=0.20.1", default-features = false }
