[package]
name = "shazam-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "M0 spikes 1 and 2: fingerprint and ask Shazam; symphonia decode, seek and duration (throwaway)"

[dependencies]
chfft = "0.3.4"
crc32fast = "1.4"
base64 = "0.22"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "flac", "pcm", "wav", "isomp4", "caf"] }
symphonia06 = { package = "symphonia", version = "0.6.1", default-features = false, features = ["mp3", "aac", "alac", "flac", "pcm", "wav", "isomp4", "caf", "opt-simd", "id3v2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rodio = { version = "=0.20.1", default-features = false }
