<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Setlist Maker — Editor</title>
<style>
  /* Tokenized, not forked: every rule below reads a token and the dark block
     redefines only tokens, so there is one set of selectors for both schemes.
     color-scheme (here and the <meta> in <head>) lets native controls -- the
     seek slider, buttons, textarea, scrollbars -- follow the scheme too. The
     deliberately scheme-free literals are the artwork overlay backdrop, the
     thumb placeholder gradients (GRADS in the script), and white text on the
     accent buttons and on those gradients. */
  :root {
    color-scheme: light dark;
    --accent:#0a84ff; --ok:#1f9d55; --warn:#c8860a;
    --bg:#f6f6f7; --card:#fff; --line:#eee; --hairline:#f4f4f4; --summary-line:#f1f1f1;
    --text:#1c1c1e; --text-soft:#3a3a3c; --muted:#8a8a8e; --text-faint:#b0b0b5; --icon:#c8c8cd;
    --focus-bg:#eef6ff; --playing-bg:#f0f7ff; --input-border:#b9d6ff;
    --btn-bg:#fff; --btn-text:#555; --btn-border:#ddd;
    /* Player bar and toast share these: dark chrome on the light page; on the
       dark page an elevated surface with a hairline, so they still read as bars
       instead of dissolving into the same grey as the list. */
    --player-bg:#1c1c1e; --player-text:#fff; --player-hover:#2f2f33; --player-muted:#9a9a9e;
    --player-thumb:#333; --player-line:transparent;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ok:#30d158; --warn:#f2b136;
      --bg:#101012; --card:#1c1c1e; --line:#2c2c2e; --hairline:#2a2a2d; --summary-line:#2a2a2d;
      --text:#f2f2f7; --text-soft:#d1d1d6; --muted:#98989d; --text-faint:#7c7c80; --icon:#5e5e63;
      --focus-bg:#1b2b42; --playing-bg:#18243a; --input-border:#2f5a8f;
      --btn-bg:#2c2c2e; --btn-text:#d1d1d6; --btn-border:#3a3a3c;
      --player-bg:#2c2c2e; --player-hover:#3a3a3c; --player-muted:#a1a1a6;
      --player-thumb:#3a3a3c; --player-line:#3a3a3c;
    }
  }
  * { box-sizing:border-box; }
  /* An author `display` rule beats the UA stylesheet's [hidden] rule, so the
     flex containers below would ignore the attribute without this. */
  [hidden] { display:none !important; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); padding-bottom:104px; }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; z-index:5; }
  .file { font-weight:700; font-size:15px; }
  .counts { color:var(--muted); font-size:12px; margin-top:2px; }
  .actions button { font:inherit; font-weight:600; font-size:13px; border-radius:7px; padding:7px 16px; cursor:pointer; border:1px solid transparent; margin-left:8px; }
  #save { background:var(--accent); color:#fff; }
  #save:disabled { opacity:.5; cursor:default; }
  #done { background:var(--btn-bg); color:var(--btn-text); border-color:var(--btn-border); }
  .summary { display:block; width:100%; max-width:760px; margin:0 auto; padding:14px 20px; font:inherit; font-size:16px; line-height:1.5; color:var(--text-soft); background:var(--card); border:none; border-bottom:1px solid var(--summary-line); resize:none; overflow:hidden; }
  .summary:focus { outline:none; background:var(--focus-bg); box-shadow:inset 0 0 0 2px var(--accent); }
  .summary::placeholder { color:var(--muted); font-style:italic; }
  main { max-width:760px; margin:0 auto; }
  .row { display:flex; align-items:center; gap:13px; padding:11px 20px; border-bottom:1px solid var(--hairline); background:var(--card); }
  .row.rejected { opacity:.45; }
  .row.editing { background:var(--focus-bg); outline:2px solid var(--accent); outline-offset:-2px; }
  .row.playing { background:var(--playing-bg); box-shadow:inset 3px 0 0 var(--accent); }
  /* background-size/position must not be re-reset by a `background` shorthand,
     here or inline in JS -- the shorthand resets every background-* longhand,
     which renders a 600px composite at natural size anchored top-left, showing
     only its corner and hiding the lower-third label entirely. */
  .thumb { width:42px; height:42px; border-radius:6px; flex:none; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; cursor:zoom-in; }
  #artwork-overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none;
    align-items:center; justify-content:center; z-index:50; cursor:zoom-out; padding:24px; overflow:auto; }
  #artwork-overlay.open { display:flex; }
  /* The panel is interactive now, so it neither inherits the backdrop's
     dismiss cursor nor closes on click -- the overlay's handler checks that
     the click landed on the backdrop itself. */
  #artwork-panel { cursor:default; width:min(90vw,600px); margin:auto; display:flex; flex-direction:column; gap:12px; }
  #artwork-large { width:100%; height:auto; border-radius:10px; box-shadow:0 12px 48px rgba(0,0,0,.5); }
  /* Sits on the backdrop rather than on a card, so it takes the player bar's
     muted token, which is legible against dark chrome in both schemes. */
  #artwork-note { color:var(--player-muted); font-size:12px; }
  #artwork-tools { display:flex; gap:8px; flex-wrap:wrap; }
  .artbtn { font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:7px; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-text); border:1px solid var(--btn-border); }
  .artbtn.on { background:var(--accent); color:#fff; border-color:transparent; }
  .artbtn:disabled { opacity:.5; cursor:default; }
  #artwork-alts { background:var(--card); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  #artwork-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:10px; }
  #artwork-grid .status { grid-column:1/-1; color:var(--muted); font-size:13px; }
  .alt { padding:0; border:2px solid transparent; border-radius:8px; background:none; cursor:pointer;
    display:flex; flex-direction:column; gap:3px; }
  .alt.current { border-color:var(--accent); }
  .alt img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:6px; display:block;
    background-color:var(--player-thumb); }
  .alt span { font-size:10px; color:var(--muted); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #artwork-url { display:flex; gap:8px; }
  #artwork-url input { flex:1; font:inherit; font-size:13px; padding:6px 9px; border:1px solid var(--input-border);
    border-radius:6px; background:var(--card); color:var(--text); }
  .star { color:var(--warn); font-size:13px; flex:none; }
  .meta { flex:1; min-width:0; cursor:text; }
  .artist { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .title { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.rejected .artist, .row.rejected .title { text-decoration:line-through; }
  .row.unknown .artist { color:var(--warn); font-style:italic; }
  .editfields { flex:1; display:flex; gap:8px; }
  .editfields input { flex:1; font:inherit; font-size:13px; padding:6px 9px; border:1px solid var(--input-border); border-radius:6px; }
  .time { color:var(--text-faint); font-size:12px; font-variant-numeric:tabular-nums; }
  .iconbtn { background:none; border:none; cursor:pointer; font-size:16px; padding:2px 4px; line-height:1; }
  .play { color:var(--accent); }
  .reject { color:var(--icon); }
  .add { color:var(--icon); font-weight:700; }
  .add:hover { color:var(--accent); }
  .editfields input.timefield { flex:0 0 80px; text-align:center; font-variant-numeric:tabular-nums; }
  #player { position:fixed; left:0; right:0; bottom:0; background:var(--player-bg); color:var(--player-text); box-shadow:0 -1px 0 var(--player-line); display:flex; align-items:center; gap:14px; padding:10px 20px; }
  #player.disabled { opacity:.4; pointer-events:none; }
  /* background-color, not the `background` shorthand: the shorthand would reset
     background-size:cover declared beside it and crop the artwork to its corner. */
  #pthumb { width:48px; height:48px; border-radius:6px; flex:none; background-color:var(--player-thumb); background-size:cover; background-position:center; }
  #pbody { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
  #ptop { display:flex; align-items:center; gap:14px; }
  #ptransport { display:flex; align-items:center; gap:2px; flex:none; }
  #ptransport button { min-width:34px; height:28px; font-size:14px; background:none; border:none; color:var(--player-text); cursor:pointer; border-radius:6px; line-height:1; }
  #ptransport button:hover { background:var(--player-hover); }
  #ptransport button span { font-size:9px; vertical-align:super; }
  #pplay { font-size:17px; }
  #plabel { flex:1; min-width:0; font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #pcount, #ppos, #ptime { color:var(--player-muted); font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; flex:none; }
  #seek { width:100%; margin:0; accent-color:var(--accent); }
  #pfoot { display:flex; justify-content:space-between; align-items:center; }
  /* Above the artwork overlay's z-index:50 -- without it, a toast raised while
     the picker is open renders behind the backdrop and is never seen. */
  #toast { position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--player-bg); color:var(--player-text); box-shadow:0 0 0 1px var(--player-line); padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="file" id="file">—</div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="actions">
      <button id="save" disabled>Save</button>
      <button id="done">Done</button>
    </div>
  </header>
  <textarea id="summary" class="summary" rows="2" aria-label="Set description" placeholder="Add a description for this set…"></textarea>
  <main id="list"></main>
  <div id="player" class="disabled">
    <div id="pthumb"></div>
    <div id="pbody">
      <div id="ptop">
        <div id="ptransport">
          <button id="pprev" title="Previous track (Up)">⏮</button>
          <button id="pback15" title="Back 15 seconds (Left)">↺<span>15</span></button>
          <button id="pplay" title="Play/pause (Space)">▶</button>
          <button id="pfwd15" title="Forward 15 seconds (Right)"><span>15</span>↻</button>
          <button id="pnext" title="Next track (Down)">⏭</button>
        </div>
        <div id="plabel">Nothing playing</div>
        <div id="pcount"></div>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek within track">
      <div id="pfoot">
        <div id="ppos">—</div>
        <div id="ptime">0:00 / 0:00</div>
      </div>
    </div>
  </div>
  <audio id="audio" src="/api/audio" preload="metadata"></audio>
  <div id="toast"></div>
  <div id="artwork-overlay">
    <div id="artwork-panel">
      <img id="artwork-large" alt="Chapter artwork preview">
      <div id="artwork-note" hidden></div>
      <div id="artwork-tools">
        <button id="art-cover" class="artbtn" type="button">☆ Episode cover</button>
        <button id="art-choose" class="artbtn" type="button">Choose artwork…</button>
      </div>
      <div id="artwork-alts" hidden>
        <div id="artwork-grid"></div>
        <div id="artwork-url">
          <input id="art-url" type="url" placeholder="…or paste an image URL" aria-label="Cover art URL">
          <button id="art-url-use" class="artbtn" type="button">Use</button>
          <button id="art-auto" class="artbtn" type="button">Automatic</button>
        </div>
      </div>
    </div>
  </div>
<script>
  const GRADS = [
    "linear-gradient(135deg,#6a5acd,#0a84ff)",
    "linear-gradient(135deg,#1f9d55,#7bd389)",
    "linear-gradient(135deg,#ff6b6b,#feca57)",
    "linear-gradient(135deg,#f857a6,#ff5858)",
    "linear-gradient(135deg,#43cea2,#185a9d)",
  ];
  let tracks = [];
  let dirty = false;
  let playingIndex = null;
  // The playing track *object*, held alongside the bare index. addBelow()'s
  // splice and commit()'s re-sort can both move the playing track to a
  // different array position without changing what's on screen for it --
  // reindexPlayingTrack() re-derives playingIndex from this reference so a
  // stale bare index never points at a different track after either mutation.
  let playingTrack = null;
  const audio = document.getElementById("audio");
  const playerEl = document.getElementById("player");
  const pplayEl = document.getElementById("pplay");
  const summaryEl = document.getElementById("summary");
  function autosizeSummary() { summaryEl.style.height = "auto"; summaryEl.style.height = summaryEl.scrollHeight + "px"; }
  summaryEl.addEventListener("input", () => { setDirty(true); autosizeSummary(); });

  function fmt(s) {
    s = Math.floor(s || 0);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const mm = (h > 0) ? String(m).padStart(2, "0") : String(m);
    return (h > 0 ? h + ":" : "") + mm + ":" + String(sec).padStart(2, "0");
  }

  // A track's window runs from its own timestamp to the next track's; the last
  // runs to the end of the audio. Derived on demand, never cached, so inserting
  // a row needs no separate bookkeeping. Clamped to >=1s so two tracks sharing a
  // timestamp cannot produce a zero-width scrubber and a division by zero.
  function windowFor(i) {
    const t = tracks[i];
    if (!t) return { start: 0, end: 1, length: 1 };
    const start = t.timestamp;
    const next = tracks[i + 1];
    const rawEnd = next ? next.timestamp : (audio.duration || start + 1);
    const end = Math.max(rawEnd, start + 1);
    return { start, end, length: end - start };
  }

  // Which track's window contains this playback position. Returns the last
  // track for a position past the final boundary, 0 for a position before the
  // first track's timestamp (a set whose first track does not start at 0).
  // The playing track keeps winning while the position is still inside its
  // own window: the backwards walk resolves two tracks sharing a timestamp to
  // the *later* one, which would otherwise re-scope (and scroll) away from
  // the earlier duplicate on the first timeupdate tick after selecting it,
  // leaving that row impossible to select at all.
  function trackIndexAt(seconds) {
    if (!tracks.length) return null;
    if (playingIndex !== null && tracks[playingIndex]) {
      const w = windowFor(playingIndex);
      if (seconds >= w.start && seconds < w.end) return playingIndex;
    }
    for (let i = tracks.length - 1; i >= 0; i--) {
      if (seconds >= tracks[i].timestamp) return i;
    }
    return 0;
  }

  // "0:43 in" / "3:17 left" for the position within track i's window.
  function fmtWindowTimes(i, seconds) {
    const w = windowFor(i);
    const into = Math.max(0, Math.min(seconds - w.start, w.length));
    return { into: fmt(into) + " in", left: fmt(w.length - into) + " left" };
  }

  // Re-derive playingIndex from playingTrack after a mutation that can move
  // array positions (splice, sort). Called at those two mutation sites, not
  // generally -- reload via load() replaces every track object wholesale, and
  // deliberately leaves playingIndex as a bare number: the reload preserves
  // ordering, so the number is still correct, and the next setPlayingIndex()
  // call (from render()) re-resolves playingTrack against the fresh objects.
  function reindexPlayingTrack() {
    if (!playingTrack) return;
    const idx = tracks.indexOf(playingTrack);
    playingIndex = idx === -1 ? null : idx;
    if (idx === -1) playingTrack = null;
  }

  function setDirty(v) { dirty = v; document.getElementById("save").disabled = !v; }
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }

  async function load() {
    const data = await (await fetch("/api/tracklist")).json();
    document.getElementById("file").textContent = "🎚 " + data.source_file;
    tracks = data.tracks;
    summaryEl.value = data.summary || "";
    autosizeSummary();
    render();
  }

  function updateCounts() {
    const rej = tracks.filter(t => t.rejected).length;
    const ed = tracks.filter(t => t._edited).length;
    const parts = [tracks.length + " tracks"];
    if (ed) parts.push(ed + " edited");
    if (rej) parts.push(rej + " rejected");
    document.getElementById("counts").textContent = parts.join(" · ");
  }

  function render() {
    // Drop the previous generation's registrations first. A thumb that never
    // scrolled into view is never unobserved by the callback, so without this
    // every edit/reject/add leaks one stale registration per off-screen row.
    artObserver.disconnect();
    const list = document.getElementById("list");
    list.innerHTML = "";
    tracks.forEach((t, i) => list.appendChild(rowEl(t, i)));
    updateCounts();
    // Not just the highlight: an edit to the playing track's artist/title, or
    // an insert that shifts its position, must also refresh the player bar's
    // label/count/artwork. setPlayingIndex() no-ops safely when playingIndex
    // is null and cannot recurse back into render().
    setPlayingIndex(playingIndex, { scroll: false });
  }

  let artVersion = 0;  // bumped on save so re-requested thumbs bypass the browser's decoded-image cache

  // Generate visible rows first: 60-track sets are network-bound on a miss.
  const artObserver = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const el = e.target;
      artObserver.unobserve(el);
      const img = new Image();
      // 404 = unidentified or out of range; keep the gradient placeholder.
      img.onload = () => { el.style.backgroundImage = "url('" + img.src + "')"; };
      img.src = "/api/artwork?index=" + el.dataset.index + "&v=" + artVersion;
    }
  }, { rootMargin: "200px" });  // start just before the row scrolls into view

  const overlay = document.getElementById("artwork-overlay");
  const overlayImg = document.getElementById("artwork-large");
  const artNote = document.getElementById("artwork-note");
  const artAlts = document.getElementById("artwork-alts");
  const artGrid = document.getElementById("artwork-grid");
  const artUrlEl = document.getElementById("art-url");
  const artCoverBtn = document.getElementById("art-cover");

  // The track the panel is showing, held as an object reference rather than a
  // position: render() rebuilds every row and addBelow()/commit() can re-sort
  // the array while the panel is open, so a stored index would go stale the
  // same way playingIndex does (hence reindexPlayingTrack).
  let artTrack = null;
  // Which tile the grid marks as in use. Seeded from the server's own `current`
  // flag rather than compared against artTrack.coverart_url: the server offers
  // the in-use cover at the size the picker uses, so a Shazam URL saved at 400px
  // arrives as the 600px one, and comparing raw strings marks nothing.
  let artCurrentUrl = null;
  let artProbeSeq = 0;   // orders overlapping paste-a-URL probes; see useTypedUrl

  function setPickNote(url) {
    artNote.textContent = url
      ? "Chosen — Save to apply it to the chapter image."
      : "Back to automatic — Save to look the artwork up again.";
    artNote.hidden = false;
  }

  function showArtwork(t) {
    artTrack = t;
    artAlts.hidden = true;
    artGrid.innerHTML = "";
    artUrlEl.value = "";
    if (t._art) {
      // An unsaved pick has to survive closing and reopening the panel. The
      // server composite is still built from saved state, so showing it here
      // would contradict the row's own thumb and quietly re-mark the replaced
      // cover as the one in use.
      artCurrentUrl = t.coverart_url || null;
      overlayImg.hidden = !t.coverart_url;
      if (t.coverart_url) overlayImg.src = t.coverart_url;
      setPickNote(t.coverart_url);
    } else {
      artCurrentUrl = null;
      overlayImg.hidden = false;
      overlayImg.src = "/api/artwork?index=" + t.index + "&v=" + artVersion;
      artNote.hidden = true;
    }
    syncCoverButton();
    overlay.classList.add("open");
  }

  function closeArtwork() {
    overlay.classList.remove("open");
    overlayImg.src = "";
    artTrack = null;
  }

  // Only the backdrop dismisses; the panel is full of controls now. Escape
  // still routes through here, since overlay.click() targets the overlay itself.
  overlay.onclick = (e) => { if (e.target === overlay) closeArtwork(); };

  function syncCoverButton() {
    const on = !!(artTrack && artTrack.episode_cover);
    const rejected = !!(artTrack && artTrack.rejected);
    artCoverBtn.textContent = (on ? "★" : "☆") + " Episode cover";
    artCoverBtn.classList.toggle("on", on);
    // A rejected track is absent from the output, and from the sidecar the star
    // is stored in, so it cannot be the cover. The server refuses the star for
    // one; this stops the page offering a choice that would silently evaporate.
    artCoverBtn.disabled = rejected;
    artCoverBtn.title = rejected
      ? "A rejected track cannot be the episode cover"
      : on
        ? "This track's artwork is the episode cover"
        : "Use this track's artwork as the episode cover";
  }

  // Exactly one track can be the episode cover, so starring one clears the
  // rest. The server re-applies the same rule on save, so a stale page cannot
  // leave two starred in the sidecar.
  artCoverBtn.onclick = () => {
    if (!artTrack || artTrack.rejected) return;
    const on = !artTrack.episode_cover;
    tracks.forEach(t => { t.episode_cover = false; });
    artTrack.episode_cover = on;
    setDirty(true);
    syncCoverButton();
    render();
  };

  document.getElementById("art-choose").onclick = () => {
    if (!artTrack) return;
    artAlts.hidden = !artAlts.hidden;
    if (!artAlts.hidden && !artGrid.childElementCount) loadAlternates(artTrack);
  };

  // Lazy and per-track: the server asks every source here instead of stopping
  // at the first that answers, so this costs a handful of third-party requests
  // and must never run for a track the user did not open.
  async function loadAlternates(t) {
    artGrid.innerHTML = '<div class="status">Searching iTunes, Deezer and Cover Art Archive…</div>';
    let data;
    try {
      // The live artist/title, not the saved ones: correcting a bad
      // identification and then fixing its cover is one workflow, and searching
      // the stale name would offer covers for the song being corrected away.
      const query = "/api/artwork/options?index=" + t.index
        + "&artist=" + encodeURIComponent(t.artist || "")
        + "&title=" + encodeURIComponent(t.title || "");
      data = await (await fetch(query)).json();
    } catch (e) {
      artGrid.innerHTML = '<div class="status">Could not reach the artwork sources.</div>';
      return;
    }
    if (t !== artTrack) return;  // the panel moved to another track while we waited
    const found = (data && data.candidates) || [];
    const failed = !!(data && data.error);
    if (!found.length) {
      // "Nothing found" and "the lookup blew up" are different answers, and the
      // second one is worth retrying.
      artGrid.innerHTML = failed
        ? '<div class="status">Could not reach the artwork sources.</div>'
        : '<div class="status">No alternates found for this track.</div>';
      return;
    }
    artGrid.innerHTML = "";
    // The server's flag reflects *saved* state; an unsaved pick made on this
    // page is the better answer and keeps its marker.
    if (!t._art) {
      const inUse = found.find(c => c.current);
      artCurrentUrl = inUse ? inUse.url : null;
    }
    for (const c of found) {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "alt";
      tile.dataset.url = c.url;
      tile.title = c.label ? c.source + " — " + c.label : c.source;
      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = tile.title;
      // Loaded straight from the source, like the player bar's thumbnail: the
      // covers differ only in the picture, and the identical lower-third they
      // would all be composited under adds nothing to the comparison.
      img.src = c.url;
      const cap = document.createElement("span");
      cap.textContent = c.source;  // textContent, not innerHTML — no XSS surface
      tile.append(img, cap);
      tile.onclick = () => chooseArtwork(c.url);
      artGrid.append(tile);
    }
    if (failed) {
      // Some tiles arrived, but not all of them: say so rather than let a short
      // grid read as "this is everything there is".
      const status = document.createElement("div");
      status.className = "status";
      status.textContent = "Some artwork sources could not be reached.";
      artGrid.append(status);
    }
    markCurrentAlt();
  }

  function markCurrentAlt() {
    artGrid.querySelectorAll(".alt").forEach(
      el => el.classList.toggle("current", !!artCurrentUrl && el.dataset.url === artCurrentUrl));
  }

  // A pick lands in coverart_url, which is what the artwork cache keys on and
  // what the embed reads. `_art` marks the row as carrying a deliberate choice:
  // it is why the save payload includes the URL at all, and why the thumb
  // previews the raw image until the server has rebuilt the composite.
  function chooseArtwork(url) {
    if (!artTrack) return;
    artTrack.coverart_url = url || null;
    artTrack._art = true;
    artCurrentUrl = url || null;
    setDirty(true);
    overlayImg.hidden = !url;
    if (url) overlayImg.src = url;
    setPickNote(url);
    markCurrentAlt();
    render();
  }

  document.getElementById("art-auto").onclick = () => chooseArtwork(null);
  document.getElementById("art-url-use").onclick = () => useTypedUrl();
  artUrlEl.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); useTypedUrl(); }
  });

  // Load the URL here before pinning it. The server falls through its waterfall
  // when a cover URL fails to download, so a dead link would not error -- it
  // would quietly composite some other source's art under this track's name.
  function useTypedUrl() {
    const url = artUrlEl.value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) {
      artNote.textContent = "Artwork URLs must start with http:// or https://.";
      artNote.hidden = false;
      return;
    }
    artNote.textContent = "Loading that image…";
    artNote.hidden = false;
    // Captured, like loadAlternates does: the probe resolves asynchronously, so
    // pinning to whatever artTrack happens to be by then would land the URL on a
    // different track (or on none, if the panel was closed meanwhile). The
    // sequence number covers the other direction -- two pastes for the *same*
    // track, where a slower first probe would otherwise land last and win.
    const target = artTrack;
    const seq = ++artProbeSeq;
    const live = () => seq === artProbeSeq && target === artTrack;
    const probe = new Image();
    probe.onload = () => { if (live()) chooseArtwork(url); };
    probe.onerror = () => {
      if (live()) artNote.textContent = "That URL did not load as an image.";
    };
    probe.src = url;
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) { overlay.click(); return; }
    // The artwork panel owns the keyboard while it is open: its candidate tiles
    // are BUTTONs, and the guard below exempts only inputs, so the arrows would
    // seek the audio while the user is browsing covers.
    if (overlay.classList.contains("open")) return;
    // Never steal keys from an editor: artist/title/time fields and the summary
    // textarea all need Space and the arrows to behave normally. #seek is an
    // INPUT too, but deliberately excluded -- e.preventDefault() below already
    // blocks its native arrow-key stepping, so arrows should seek rather than
    // get eaten here just because the scrubber has focus.
    // tagName is enough because this page has no contenteditable surface (and
    // no shadow root that could hide one behind its host). Anyone adding a
    // rich-text field must extend this guard (e.g. el.isContentEditable), or
    // Space and the arrows will be eaten while they type.
    const el = document.activeElement;
    if (el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type !== "range"))) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (playerEl.classList.contains("disabled")) return;
    switch (e.key) {
      case " ":
        // Space normally activates a focused button; only #pplay should
        // intercept it here, so Tab-to-Save-and-press-Space still saves.
        if (el && el.tagName === "BUTTON" && el.id !== "pplay") return;
        e.preventDefault(); pplayEl.click(); break;
      case "ArrowLeft":  e.preventDefault(); skip(-SKIP_SECONDS); break;
      case "ArrowRight": e.preventDefault(); skip(SKIP_SECONDS); break;
      case "ArrowUp":    e.preventDefault(); prevTrack(); break;
      case "ArrowDown":  e.preventDefault(); nextTrack(); break;
    }
  });

  function rowEl(t, i) {
    const unknown = !t.artist && !t.title;
    const row = document.createElement("div");
    row.className = "row" + (t.rejected ? " rejected" : "") + (unknown ? " unknown" : "");

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    // backgroundImage, never the `background` shorthand: the shorthand resets
    // background-size/position, so the composite would render at natural size
    // anchored top-left -- a corner crop with its label off-screen.
    thumb.style.backgroundImage = GRADS[i % GRADS.length];
    const hasIndex = t.index !== undefined && t.index !== null;
    if (unknown) {
      thumb.textContent = "?";
    } else if (hasIndex) {
      // The gradient stays until the composite lands, so rows never jump.
      thumb.dataset.index = t.index;
      thumb.onclick = (e) => { e.stopPropagation(); showArtwork(t); };
      if (t._art) {
        // Picked in this session and not saved yet. The server's composite is
        // still built from the old art, so requesting it would contradict what
        // the user just chose; show the raw choice instead. "Automatic" leaves
        // no URL to show, so the gradient placeholder stands in until the save.
        if (t.coverart_url) thumb.style.backgroundImage = "url('" + t.coverart_url + "')";
      } else {
        artObserver.observe(thumb);
      }
    }
    // else: an unsaved inserted row has no server index yet -- keep the
    // gradient placeholder and skip the artwork request entirely.
    row.appendChild(thumb);

    const meta = document.createElement("div");
    meta.className = "meta";
    const artistEl = document.createElement("div");
    artistEl.className = "artist";
    artistEl.textContent = t.artist || (unknown ? "Unidentified" : "");
    const titleEl = document.createElement("div");
    titleEl.className = "title";
    titleEl.textContent = t.title || (unknown ? "add a label" : "");
    meta.append(artistEl, titleEl);  // textContent, not innerHTML — no XSS surface
    meta.onclick = () => startEdit(row, i);
    row.appendChild(meta);

    // Passive badge, not a control: the choice is made in the artwork panel,
    // but which track carries it has to be visible without opening every row.
    if (t.episode_cover) {
      const star = document.createElement("div");
      star.className = "star";
      star.textContent = "★";
      star.title = "This track's artwork is the episode cover";
      row.appendChild(star);
    }

    const time = document.createElement("div");
    time.className = "time"; time.textContent = t.time;
    row.appendChild(time);

    const play = document.createElement("button");
    play.className = "iconbtn play"; play.textContent = "▶";
    play.onclick = (e) => { e.stopPropagation(); playFrom(i, { scroll: false }); };
    row.appendChild(play);

    const rej = document.createElement("button");
    rej.className = "iconbtn reject"; rej.textContent = t.rejected ? "↩" : "✕";
    rej.onclick = (e) => {
      e.stopPropagation();
      t.rejected = !t.rejected;
      // A rejected track is absent from the output entirely -- including from
      // the sidecar, which is where the star is stored -- so it cannot be the
      // episode cover. Clearing it here keeps the ★ from lingering on a row
      // whose choice would silently vanish on the next reload.
      if (t.rejected) t.episode_cover = false;
      setDirty(true);
      render();
    };
    row.appendChild(rej);

    const add = document.createElement("button");
    add.className = "iconbtn add"; add.textContent = "＋"; add.title = "Add a track below";
    add.onclick = (e) => { e.stopPropagation(); addBelow(i); };
    row.appendChild(add);

    return row;
  }

  const INSERT_TAIL_GAP = 30;  // seconds past the last track when adding at the end

  // Parse "M:SS", "MM:SS", or "H:MM:SS" into seconds; null if unparseable.
  function parseTime(str) {
    const parts = (str || "").trim().split(":");
    if (parts.length < 2 || parts.length > 3 || !parts.every(p => /^\d+$/.test(p.trim()))) return null;
    const n = parts.map(p => parseInt(p, 10));
    return n.length === 3 ? n[0] * 3600 + n[1] * 60 + n[2] : n[0] * 60 + n[1];
  }

  // Insert a blank, editable track after row i; default its time to the midpoint
  // to the next track (or just past the last one), then open it for editing.
  function addBelow(i) {
    const cur = tracks[i], next = tracks[i + 1];
    const ts = next ? Math.floor((cur.timestamp + next.timestamp) / 2) : cur.timestamp + INSERT_TAIL_GAP;
    tracks.splice(i + 1, 0, { artist: "", title: "", timestamp: ts, time: fmt(ts), rejected: false, _new: true });
    reindexPlayingTrack();  // the splice can shift the playing track's index
    setDirty(true);
    render();
    const row = document.getElementById("list").children[i + 1];
    if (row) startEdit(row, i + 1);
  }

  function startEdit(row, i) {
    if (row.querySelector(".editfields")) return;
    const t = tracks[i];
    const isNew = !!t._new;
    const meta = row.querySelector(".meta");
    row.classList.add("editing");
    const wrap = document.createElement("div");
    wrap.className = "editfields";
    const a = document.createElement("input"); a.value = t.artist; a.placeholder = "Artist";
    const ti = document.createElement("input"); ti.value = t.title; ti.placeholder = "Title";
    wrap.appendChild(a); wrap.appendChild(ti);
    // Inserted rows also edit their timestamp; existing rows keep title/artist only.
    let tm = null;
    if (isNew) {
      tm = document.createElement("input");
      tm.className = "timefield"; tm.value = t.time || fmt(t.timestamp); tm.placeholder = "MM:SS";
      wrap.appendChild(tm);
    }
    meta.replaceWith(wrap);
    a.focus();
    function commit() {
      const na = a.value.trim(), nt = ti.value.trim();
      if (na !== t.artist || nt !== t.title) { t.artist = na; t.title = nt; if (!isNew) t._edited = true; setDirty(true); }
      if (tm) {
        const secs = parseTime(tm.value);
        if (secs !== null && secs !== t.timestamp) {
          t.timestamp = secs; setDirty(true);
          tracks.sort((x, y) => x.timestamp - y.timestamp);
          reindexPlayingTrack();  // the re-sort can shift the playing track's index
        }
        t.time = fmt(t.timestamp);
      }
      render();
    }
    a.addEventListener("keydown", ev => { if (ev.key === "Enter") ti.focus(); if (ev.key === "Escape") render(); });
    ti.addEventListener("keydown", ev => { if (ev.key === "Enter") { if (tm) tm.focus(); else commit(); } if (ev.key === "Escape") render(); });
    if (tm) tm.addEventListener("keydown", ev => { if (ev.key === "Enter") commit(); if (ev.key === "Escape") render(); });
    wrap.addEventListener("focusout", () => { setTimeout(() => { if (!wrap.contains(document.activeElement)) commit(); }, 0); });
  }

  // The highlight must be reapplied after render(), which rebuilds every row.
  function highlightPlayingRow(scroll) {
    const list = document.getElementById("list");
    list.querySelectorAll(".row.playing").forEach(el => el.classList.remove("playing"));
    if (playingIndex === null) return;
    const row = list.children[playingIndex];
    if (!row) return;
    row.classList.add("playing");
    if (scroll) row.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  const SKIP_SECONDS = 15;
  const PREV_RESTART_THRESHOLD = 3;  // ⏮ within this many seconds goes to the previous track

  // Seeks clamp to the audio's real bounds, never to the track window: crossing
  // a boundary is how a user checks whether that boundary is right.
  function seekTo(seconds) {
    if (!audio.duration) return;
    audio.currentTime = Math.max(0, Math.min(seconds, audio.duration));
    syncPlayerUI();
  }

  // Point the player at track i without seeking. `scroll` brings its row into
  // view -- true only on automatic advance, since a row the user just clicked is
  // already under their cursor and yanking the list would be hostile.
  function setPlayingIndex(i, opts) {
    if (i === null || !tracks[i]) return;
    playingIndex = i;
    const t = tracks[i];
    playingTrack = t;
    document.getElementById("plabel").textContent =
      (t.artist || "Unidentified") + (t.title ? " — " + t.title : "");
    document.getElementById("pcount").textContent = "track " + (i + 1) + " of " + tracks.length;
    const pt = document.getElementById("pthumb");
    // backgroundImage, never the `background` shorthand -- see the CSS comment.
    pt.style.backgroundImage = t.coverart_url
      ? "url('" + t.coverart_url + "')"
      : GRADS[i % GRADS.length];
    highlightPlayingRow(opts && opts.scroll);
  }

  // `scroll` defaults to true: any jump the user did not initiate by clicking a
  // specific row should bring the destination into view. Only the row's own ▶
  // passes false, because that row is already under the cursor.
  function playFrom(i, opts) {
    const scroll = !opts || opts.scroll !== false;
    setPlayingIndex(i, { scroll });
    // Capture the track now, not inside start(): if metadata is still
    // loading, start() runs later and a re-indexed `tracks[i]` at that point
    // could be a different track (or throw if tracks was replaced by load()).
    const track = tracks[i];
    const start = () => { audio.currentTime = track.timestamp; audio.play(); };
    if (audio.readyState >= 1) start();
    else audio.addEventListener("loadedmetadata", start, { once: true });
  }

  function skip(delta) { seekTo(audio.currentTime + delta); }

  // Prev/next step through `tracks` by position, so rejected tracks are included
  // -- a track is often auditioned before the decision to un-reject it.
  function prevTrack() {
    const i = playingIndex === null ? trackIndexAt(audio.currentTime) : playingIndex;
    if (i === null) return;
    // Familiar transport convention: restart this track unless already near its start.
    const target = (audio.currentTime - tracks[i].timestamp > PREV_RESTART_THRESHOLD)
      ? i : Math.max(0, i - 1);
    playFrom(target);
  }

  function nextTrack() {
    const i = playingIndex === null ? trackIndexAt(audio.currentTime) : playingIndex;
    if (i === null) return;
    playFrom(Math.min(tracks.length - 1, i + 1));
  }

  // Declared before syncPlayerUI, which reads it: `let` has no hoisted value,
  // so defining it after would leave a temporal-dead-zone trap for any future
  // caller that runs earlier than these listeners.
  let seekDragging = false;

  // Reflect audio state into the bar. Called on timeupdate and after any seek.
  function syncPlayerUI() {
    const seek = document.getElementById("seek");
    document.getElementById("ptime").textContent =
      fmt(audio.currentTime) + " / " + fmt(audio.duration);
    if (playingIndex === null) return;
    const w = windowFor(playingIndex);
    const frac = Math.max(0, Math.min((audio.currentTime - w.start) / w.length, 1));
    if (!seekDragging) seek.value = String(Math.round(frac * 1000));
    const times = fmtWindowTimes(playingIndex, audio.currentTime);
    document.getElementById("ppos").textContent = times.into + " · " + times.left;
  }

  pplayEl.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
  document.getElementById("pback15").onclick = () => skip(-SKIP_SECONDS);
  document.getElementById("pfwd15").onclick = () => skip(SKIP_SECONDS);
  document.getElementById("pprev").onclick = prevTrack;
  document.getElementById("pnext").onclick = nextTrack;

  audio.addEventListener("play", () => pplayEl.textContent = "⏸");
  audio.addEventListener("pause", () => pplayEl.textContent = "▶");
  audio.addEventListener("loadedmetadata", () => {
    playerEl.classList.remove("disabled");
    syncPlayerUI();
  });
  audio.addEventListener("error", () => playerEl.classList.add("disabled"));
  audio.addEventListener("timeupdate", syncPlayerUI);
  // Playback deliberately runs past a window's end: hearing the transition is
  // how a boundary gets verified. Re-scope to whatever track we are now inside.
  audio.addEventListener("timeupdate", () => {
    const i = trackIndexAt(audio.currentTime);
    if (i !== null && i !== playingIndex) {
      setPlayingIndex(i, { scroll: true });
      // The syncPlayerUI() listener above already ran this tick against the
      // old index, so the thumb/position would otherwise show one stale
      // frame (pegged to the old window's edge) until the next timeupdate.
      syncPlayerUI();
    }
  });

  const seekEl = document.getElementById("seek");
  seekEl.addEventListener("pointerdown", () => { seekDragging = true; });
  // A drag the OS interrupts (gesture cancelled, pointer lost) ends in
  // pointercancel with no pointerup; a flag stuck true would keep timeupdate
  // from moving the thumb until the next complete drag cleared it.
  const endSeekDrag = () => { seekDragging = false; };
  seekEl.addEventListener("pointerup", endSeekDrag);
  seekEl.addEventListener("pointercancel", endSeekDrag);
  seekEl.addEventListener("input", e => {
    // Same fallback as skip()/prevTrack()/nextTrack(): before the first play
    // playingIndex is null, but the scrubber should still work.
    const i = playingIndex === null ? trackIndexAt(audio.currentTime) : playingIndex;
    if (i === null) return;
    const w = windowFor(i);
    seekTo(w.start + (e.target.value / 1000) * w.length);
  });

  document.getElementById("save").onclick = async () => {
    // Existing rows map back by their stable server index (NOT array position,
    // which inserted rows shift); new rows carry a timestamp and no index.
    const hasNew = tracks.some(t => t._new);
    const payload = { summary: summaryEl.value, tracks: tracks.map(t => {
      if (t._new) return { artist: t.artist, title: t.title, timestamp: t.timestamp, rejected: !!t.rejected };
      const edit = { index: t.index, artist: t.artist, title: t.title,
                     rejected: !!t.rejected, episode_cover: !!t.episode_cover };
      // Only rows whose artwork the user actually picked carry a coverart_url.
      // Sending it for every row would re-pin the art that apply_track_edit()
      // deliberately drops when an artist/title is corrected (#30).
      if (t._art) edit.coverart_url = t.coverart_url;
      return edit;
    }) };
    try {
      const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const res = await r.json();
      if (res.ok) {
        // Always re-render: an edited artist/title changes the composite, and
        // the thumb must re-request against the now-saved server state.
        artVersion++;
        // The picks are on the server now, so rows go back to previewing its
        // regenerated composite instead of the raw image that was chosen.
        tracks.forEach(t => { delete t._art; });
        // The open panel is showing a pre-save preview and a "Save to apply"
        // note, and after a reload its track object is stale; close it rather
        // than leave either lying.
        if (overlay.classList.contains("open")) closeArtwork();
        if (hasNew) await load();  // inserted rows also need real indices
        else render();
        setDirty(false); toast("Saved");
      } else { toast("Save failed: " + (res.error || "")); }
    } catch (e) { toast("Save failed"); }
  };

  document.getElementById("done").onclick = async () => {
    if (dirty && !confirm("You have unsaved changes. Close anyway?")) return;
    dirty = false;
    await fetch("/api/done", { method: "POST" }).catch(() => {});
    document.body.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;color:var(--muted);font-family:sans-serif">Editor closed — you can close this tab.</div>';
    setTimeout(() => { try { window.close(); } catch (e) {} }, 300);
  };

  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  load();
</script>
</body>
</html>
