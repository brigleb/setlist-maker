    titleIn.value = t.title; titleIn.placeholder = "Title"; titleIn.setAttribute("aria-label", "Title");
    const commit = () => { if (setNames(t, artistIn.value, titleIn.value)) render(); };
    artistIn.readOnly = titleIn.readOnly = liveMode;
    for (const input of [artistIn, titleIn]) {
      input.addEventListener("change", commit);
      input.addEventListener("keydown", ev => {
        if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
        if (ev.key === "Escape") { input.value = input === artistIn ? t.artist : t.title; input.blur(); }
      });
    }
    box.appendChild(el("div", "in-lbl", "Artist"));
    box.appendChild(artistIn);
    box.appendChild(el("div", "in-lbl", "Title"));
    box.appendChild(titleIn);

    // Every name Shazam gave the audio in this window. The neighbours' names are
    // left out: a probe at the edge hearing the next track is not a candidate.
    const neighbours = k === -1 ? [] : [kept[k - 1], kept[k + 1]].filter(Boolean).map(x => tracks[x.index]);
    const names = TL.variants(joined, neighbours);
    if (names.length) {
      box.appendChild(el("div", "in-lbl", "Shazam heard"));
      for (const v of names) {
        const line = el("div", "in-variant");
        line.appendChild(el("div", "nm", v.artist + " — " + v.title)).title = v.artist + " — " + v.title;
        line.appendChild(el("span", "ct", "×" + v.count));
        const current = v.artist === t.artist && v.title === t.title;
        const use = el("button", "tbtn", current ? "in use" : "Use");
        use.disabled = current || liveMode;
        use.onclick = () => { if (setNames(t, v.artist, v.title)) render(); };
        line.appendChild(use);
        box.appendChild(line);
      }
    }

    if (joined.length) {
      box.appendChild(el("div", "in-lbl", "Samples — click to hear one"));
      const list = el("div", "in-samples");
      for (const p of joined) {
        const b = el("button");
        b.type = "button";
        b.appendChild(el("span", null, TL.fmt(p.t)));
        const hit = p.artist || p.title;
        b.appendChild(el("span", "nm" + (hit ? "" : " miss"), hit ? (p.artist || "?") + " — " + (p.title || "?") : "no match"));
        b.appendChild(el("span", null, p.purpose === "refine" ? "12s" : p.window + "s"));
        b.title = p.purpose + (p.confidence ? " · confidence " + p.confidence : "");
        b.onclick = () => playAt(p.t);
        list.appendChild(b);
      }
      box.appendChild(list);
    }

    // What was merged into this track, one Unmerge each: the grid shows these
    // only as seams too close together to click.
    if (k !== -1) {
      const end = kept[k + 1] ? kept[k + 1].index : tracks.length;
      const folded = tracks.slice(i + 1, end);
      if (folded.length) {
        box.appendChild(el("div", "in-lbl", "Merged into this track"));
        for (const m of folded) {
          const line = el("div", "in-variant");
          line.appendChild(el("div", "nm", TL.fmt(m.timestamp) + " " + trackName(m))).title = trackName(m);
          const un = el("button", "tbtn", "Unmerge");
          un.disabled = liveMode;
          un.onclick = () => toggleMerge(m);
          line.appendChild(un);
          box.appendChild(line);
        }
      }
    }

    const btns = el("div", "in-btns");
    const play = el("button", "tbtn primary", "▶ Play");
    play.onclick = () => playFrom(i, { scroll: false });
    const split = el("button", "tbtn in-split", "Split at playhead");
    const now = audio.currentTime || 0;
    split.disabled = !(now > w.start + 1 && now < w.end - 1);
    split.title = split.disabled ? "Play inside this track, then split where the next one starts" : "Start a new track at " + TL.fmt(now);
    split.onclick = splitAtPlayhead;
    const merge = el("button", "tbtn", t.rejected ? "Unmerge" : (i === 0 ? "Reject" : "Merge into previous"));
    merge.onclick = () => toggleMerge(t);
    const add = el("button", "tbtn", "＋ Add below");
    add.onclick = () => addBelow(i);
    btns.append(play);
    if (!liveMode) btns.append(split, merge, add);
    if (canArt && !liveMode) {
      const artBtn = el("button", "tbtn", "Artwork…");
      artBtn.onclick = () => showArtwork(t);
      btns.appendChild(artBtn);
    }
    box.appendChild(btns);
    if (t.rejected) box.appendChild(el("div", "in-note", "Merged tracks are left out of the tracklist when you save; their time goes to the track before."));
    if (liveMode) box.appendChild(el("div", "in-note", "Still identifying — this is the run's current answer, and it may change as the run narrows the boundaries. Editing opens when it finishes."));
  }

  // ---- needs a look ----
  // Ask Shazam about one moment. The pin shows as pending while the server
  // waits its turn (it paces lookups like an identify run) and then lands as
  // a real probe, already saved to the run's progress file.
  async function sampleAt(t) {
    pendingSamples.push(t);
    renderTimeline();
    try {
      const r = await fetch("/api/sample", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t }) });
      const res = await r.json();
      if (res.ok) {
        probes.push(res.probe);
        const p = res.probe;
        toast(TL.fmt(t) + " — " + (p.artist || p.title ? (p.artist || "?") + " — " + (p.title || "?") : "Shazam heard nothing it knew"));
      } else {
        toast("Sample failed: " + (res.error || r.status));
      }
    } catch (e) {
      toast("Sample failed");
    } finally {
      pendingSamples.splice(pendingSamples.indexOf(t), 1);
      renderTimeline();
    }
  }

  function applyFix(fix) {
    if (fix.sample) {
      // Evidence, not an edit: nothing to save. Sequential, so the pins land in
      // the order they were asked for rather than racing the server's queue.
      (async () => { for (const t of fix.sample) await sampleAt(t); })();
      return;
    }
    for (const idx of fix.reject || []) {
      const t = tracks[idx];
      if (!t) continue;
      t.rejected = true;
      t.episode_cover = false;
    }
    for (const r of fix.retitle || []) {
      const t = tracks[r.index];
      if (t) setNames(t, t.artist, r.title);
    }
    setDirty(true);
    render();
  }

  function renderIssues() {
    const box = document.getElementById("issues");
    box.innerHTML = "";
    const issues = TL.findIssues(tracks, probes, setDuration()).filter(x => !dismissedIssues.has(x.key));
    document.getElementById("qcount").textContent = issues.length;
    if (!issues.length) { box.appendChild(el("div", "t2", "Nothing left that looks wrong.")); return; }
    for (const x of issues) {
      const [glyph, colour] = ISSUE_STYLE[x.kind] || ["•", "var(--muted)"];
      const row = el("div", "issue");
      const ico = el("div", "ico", glyph);
      ico.style.background = colour;
      const txt = el("div", "txt");
      txt.appendChild(el("div", "t1", x.title));
      txt.appendChild(el("div", "t2", x.detail));
      row.append(ico, txt);
      if (x.fix && (x.fix.sample ? canSample : !liveMode)) {
        const fix = el("button", "tbtn", x.fix.label);
        fix.onclick = e => {
          e.stopPropagation();
          applyFix(x.fix);
          if (!x.fix.sample) toast(x.fix.label + " — ⌘Z undoes it, Save writes it");
        };
        row.appendChild(fix);
      }
      const dismiss = el("button", "x", "×");
      dismiss.title = "Not a problem";
      dismiss.onclick = e => { e.stopPropagation(); dismissedIssues.add(x.key); renderIssues(); };
      row.appendChild(dismiss);
      row.onclick = () => selectTrack(tracks[x.index], { reveal: true });
      box.appendChild(row);
    }
  }

  // One poll at a time: a replay slower than the interval must not stack, or a
  // late answer could land after the switch to editing.
  let polling = false;
  async function pollLive() {
    if (polling || !liveMode) return;
    polling = true;
    try { await loadProbes(); } finally { polling = false; }
  }

  function setLive(on) {
    liveMode = on;
    document.body.classList.toggle("live", on);
    summaryEl.readOnly = on;
    if (on && !livePoll) livePoll = setInterval(pollLive, 3000);
    if (!on && livePoll) { clearInterval(livePoll); livePoll = null; }
  }

  // A live run's tracklist is re-derived after every probe, so boundaries move
  // and tracks appear. Keep the selection on whatever track now covers the
  // moment that was selected, and the player on whatever covers the playhead.
  async function refreshLiveTracks() {
    let focus = null;
    if (selectedTrack) {
      const i = tracks.indexOf(selectedTrack);
      const w = i === -1 ? null : windowFor(i);
      if (w) focus = (w.start + w.end) / 2;
    }
    const data = await (await fetch("/api/tracklist")).json();
    if (!liveMode || !data.live) return;  // the run finished meanwhile; load() owns the page now
    tracks = data.tracks;
    resetHistory();
    if (focus !== null) {
      const W = TL.windows(tracks, setDuration());
      const k = W.findIndex(w => focus >= w.start && focus < w.end);
      selectedTrack = k === -1 ? null : tracks[k];
    }
    if (playingIndex !== null) {
      playingIndex = null;
      playingTrack = null;
      const k = trackIndexAt(audio.currentTime);
      if (k !== null && !audio.paused) playingIndex = k;
    }
    render();
  }

  // Drop the pins back in, in the order the run asked for them -- the coarse
  // sweep first, then the refinement crowding into each boundary.
  document.getElementById("tl-replay").onclick = () => {
    if (replayShown !== null || !probes.length) return;
    replayShown = 0;
    const step = Math.max(15, Math.min(120, 12000 / probes.length));
    const tick = () => {
      replayShown++;
      if (replayShown >= probes.length) { replayShown = null; renderTimeline(); return; }
      renderTimeline();
      setTimeout(tick, step);
    };
    tick();
  };

  load();
</script>
</body>
</html>
