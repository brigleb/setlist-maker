<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Setlist Maker — Editor</title>
<link rel="stylesheet" href="/web/editor.css">
<script type="importmap">
{ "imports": { "preact": "/web/preact.js", "preact/hooks": "/web/preact_hooks.js", "htm": "/web/htm.js" } }
</script>
</head>
<body>
  <header id="toolbar">
    <div>
      <div class="file"><span id="file">—</span><span id="livepill" title="Following the run as it samples; editing opens when it finishes">identifying</span></div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="actions">
      <button id="undo" class="histbtn" disabled title="Undo (⌘Z)">Undo</button>
      <button id="redo" class="histbtn" disabled title="Redo (⇧⌘Z)">Redo</button>
      <button id="save" disabled>Save</button>
      <button id="done">Done</button>
      <button id="keys-btn" class="histbtn" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      <button id="side-toggle" class="histbtn" type="button" aria-controls="side" aria-expanded="false" title="Show the inspector">Inspector</button>
    </div>
  </header>
  <section id="timeline" class="pane" aria-label="Timeline">
    <div id="tl-head">
      <div class="tl-title">Timeline</div>
      <div class="tl-stats" id="tl-stats"></div>
      <button id="tl-replay" class="tbtn" type="button" title="Drop the samples in again, in the order the run asked for them">▶ Replay the run</button>
    </div>
    <div id="tl-rows">
      <div id="tl-mini" title="The whole set: drag the box to move the view, double-click to see it all">
        <canvas id="tl-mini-wave"></canvas>
        <div id="tl-mini-box" hidden></div>
      </div>
      <div id="tl-view">
        <div id="tl-ruler" class="tl-ruler"></div>
        <div id="tl-band">
          <canvas id="tl-wave"></canvas>
          <div id="tl-blocks" class="tl-blocks"></div>
        </div>
        <div id="tl-pins" class="tl-pins"></div>
        <div class="tl-playhead" hidden></div>
      </div>
    </div>
    <div class="tl-legend"><span><i></i>30s sample</span><span><i class="refine"></i>12s refine</span><span><i class="miss"></i>heard nothing</span><span><i class="manual"></i>you asked</span></div>
  </section>
  <div id="split-tl" class="divider rows" role="separator" aria-orientation="horizontal" aria-label="Resize the timeline" tabindex="0"></div>
  <div id="work">
    <section id="listpane" class="pane" aria-label="Tracklist">
      <div id="list-head" class="trow"><span class="c-num">#</span><span></span><span>Artist</span><span>Title</span><span class="c-num">Start</span><span class="c-num len">Length</span><span class="c-num smp" title="Samples Shazam took inside this track">Samples</span><span class="star"></span><span></span></div>
      <main id="list" role="listbox" aria-label="Tracks"></main>
    </section>
    <div id="split-side" class="divider cols" role="separator" aria-orientation="vertical" aria-label="Resize the inspector" tabindex="0"></div>
    <aside id="side" class="pane">
      <div id="tabs" role="tablist">
        <button role="tab" id="tab-track" data-tab="track" aria-controls="panel-track" aria-selected="true">Track</button>
        <button role="tab" id="tab-set" data-tab="set" aria-controls="panel-set" aria-selected="false" tabindex="-1">Set</button>
        <button role="tab" id="tab-queue" data-tab="queue" aria-controls="panel-queue" aria-selected="false" tabindex="-1">Needs a look <span id="qcount" class="count">0</span></button>
      </div>
      <div id="panel-track" class="panel" role="tabpanel" aria-labelledby="tab-track"><div id="insp"></div></div>
      <div id="panel-set" class="panel" role="tabpanel" aria-labelledby="tab-set" hidden>
        <div class="in-lbl">Description</div>
        <textarea id="summary" class="summary" rows="3" aria-label="Set description" placeholder="Add a description for this set…"></textarea>
        <div class="in-lbl">Podcast episode</div>
        <section id="episode" aria-label="Podcast episode">
          <div class="ep-row">
            <div id="ep-thumb" class="empty" title="Episode cover — drop an image here"></div>
            <div class="ep-text">
              <input id="ep-title" class="ep-field ep-title" type="text" maxlength="200" aria-label="Episode title" placeholder="Episode title" spellcheck="false">
              <input id="ep-artist" class="ep-field ep-artist" type="text" maxlength="200" aria-label="Episode artist" placeholder="Artist" spellcheck="false">
            </div>
          </div>
          <div id="ep-note" class="ep-note"></div>
          <div class="in-btns">
            <button id="ep-upload" class="tbtn" type="button">Upload cover…</button>
            <button id="ep-remove" class="tbtn" type="button" hidden>Remove cover</button>
            <input id="ep-file" type="file" accept="image/*" hidden>
            <button id="embed" class="tbtn primary" type="button" hidden title="Write the title, artist, chapter markers, chapter artwork and episode cover into the MP3 (saves first)">Embed chapters in MP3</button>
          </div>
        </section>
      </div>
      <div id="panel-queue" class="panel" role="tabpanel" aria-labelledby="tab-queue" hidden><div id="issues"></div></div>
    </aside>
  </div>
  <div id="player" class="disabled">
    <div id="pthumb"></div>
    <div id="pbody">
      <div id="ptop">
        <div id="ptransport">
          <button id="pprev" title="Previous track (⌥↑)">⏮</button>
          <button id="pback15" title="Back 15 seconds (⇧←)">↺<span>15</span></button>
          <button id="pplay" title="Play/pause (Space)">▶</button>
          <button id="pfwd15" title="Forward 15 seconds (⇧→)"><span>15</span>↻</button>
          <button id="pnext" title="Next track (⌥↓)">⏭</button>
        </div>
        <div id="plabel">Nothing playing</div>
        <div id="pcount"></div>
        <button id="pfollow" type="button" aria-pressed="false" title="Follow the playhead: the selection moves with the audio (F)">Follow</button>
      </div>
      <canvas id="seek-wave" aria-hidden="true" hidden></canvas>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek within track">
      <div id="pfoot">
        <div id="ppos">—</div>
        <div id="ptime">0:00 / 0:00</div>
      </div>
    </div>
  </div>
  <audio id="audio" src="/api/audio" preload="metadata"></audio>
  <div id="toast"></div>
  <div id="keys-overlay" hidden>
    <div id="keys-panel" role="dialog" aria-modal="true" aria-labelledby="keys-title" tabindex="-1">
      <div id="keys-top"><h2 id="keys-title">Keyboard shortcuts</h2><button id="keys-close" class="tbtn" type="button" aria-label="Close">Esc</button></div>
      <div id="keys-body"></div>
    </div>
  </div>
  <div id="artwork-overlay">
    <div id="artwork-panel">
      <img id="artwork-large" alt="Chapter artwork preview">
      <div id="artwork-note" hidden></div>
      <div id="artwork-tools">
        <button id="art-cover" class="artbtn" type="button">☆ Episode cover</button>
        <button id="art-choose" class="artbtn" type="button">Choose artwork…</button>
      </div>
      <div id="artwork-alts" hidden>
        <div id="artwork-grid"></div>
        <div id="artwork-url">
          <input id="art-url" type="url" placeholder="…or paste an image URL" aria-label="Cover art URL">
          <button id="art-url-use" class="artbtn" type="button">Use</button>
          <button id="art-auto" class="artbtn" type="button">Automatic</button>
        </div>
        <div id="artwork-upload">
          <button id="art-upload" class="artbtn" type="button">Upload image…</button>
          <span>or drop an image anywhere on this panel</span>
          <input id="art-file" type="file" accept="image/*" hidden>
        </div>
      </div>
    </div>
  </div>
<script src="/timeline.js"></script>
<script type="module" src="/web/main.js"></script>
</body>
</html>
