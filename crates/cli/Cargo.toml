[package]
name = "hindsight-cli"
version = "0.1.0"
description = "The hindsight command: identify a DJ set's tracks and embed chapters"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hindsight"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hindsight-core = { path = "../core" }
hindsight-editor = { version = "0.1.0", path = "../editor" }
log = "0.4"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tiny_http = "0.12"
