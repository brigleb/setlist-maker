[package]
name = "hindsight-cli"
version = "0.1.0"
description = "The hindsight command: identify a DJ set's tracks and embed chapters"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hindsight"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hindsight-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
